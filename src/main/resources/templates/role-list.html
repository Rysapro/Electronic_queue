<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список ролей</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .sidebar {
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 100;
            padding: 48px 0;
            box-shadow: inset -1px 0 0 rgba(0, 0, 0, .1);
            width: 280px;
            background-color: #f8f9fa;
        }

        .sidebar .nav-link {
            font-weight: 500;
            color: #333;
            padding: .75rem 1.5rem;
        }

        .sidebar .nav-link:hover {
            background-color: #e9ecef;
        }

        .sidebar .nav-link.active {
            color: #0d6efd;
            background-color: #e9ecef;
        }

        .sidebar .nav-link i {
            margin-right: .5rem;
            width: 1.25rem;
        }

        .main-content {
            margin-left: 280px;
            padding: 48px;
        }

        .navbar {
            position: fixed;
            top: 0;
            right: 0;
            left: 280px;
            z-index: 99;
            height: 48px;
            box-shadow: 0 2px 4px rgba(0, 0, 0, .1);
        }

        .container {
            max-width: 1200px;
        }

        .table th {
            background-color: #f8f9fa;
        }

        .action-column {
            width: 120px;
        }
    </style>
</head>
<body class="bg-light">
<nav class="sidebar">
    <div class="text-center p-3 mb-3">
        <h5 class="mb-0">Админ-панель</h5>
    </div>

    <ul class="nav flex-column">
        <li class="nav-item">
            <a class="nav-link active" href="/ticket/ticket-list">
                <i class="bi bi-ticket-perforated"></i>
                Талоны
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="/place/place-list">
                <i class="bi bi-geo-alt"></i>
                Места
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="/provision/provision-list">
                <i class="bi bi-gear"></i>
                Услуги
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="/information/info-list">
                <i class="bi bi-info-circle"></i>
                Информация
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="/user/user-list">
                <i class="bi bi-person"></i>
                Пользователи
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="/role/role-list">
                <i class="bi bi-shield-check"></i>
                Роли
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="/page/page-list">
                <i class="bi bi-file-earmark"></i>
                Страницы
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="/win/win-list">
                <i class="bi bi-window"></i>
                Окно
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="/status/status-list">
                <i class="bi bi-circle"></i>
                Статусы
            </a>
        </li>
    </ul>
</nav>

<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-header bg-white py-3">
            <div class="d-flex justify-content-between align-items-center">
                <h2 class="mb-0">Список ролей</h2>
                <a th:href="@{/role/role-create}" class="btn btn-primary">
                    <i class="bi bi-plus-lg"></i> Добавить роль
                </a>
            </div>
        </div>

        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Название</th>
                        <th class="text-center">Действия</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${items}">
                        <td th:text="${item.id}"></td>
                        <td th:text="${item.name}"></td>
                        <td>

                            <div class="btn-group">
                            <a th:href="@{/role/role-edit/{id}(id=${item.id})}"
                                class="btn btn-sm btn-outline-primary"
                                title="Редактировать">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <a th:href="@{/role/delete/{id}(id=${item.id})}"
                               class="btn btn-sm btn-outline-danger"
                               title="Удалить"
                               onclick="return confirm('Вы уверены, что хотите удалить этот талон?')">
                                <i class="bi bi-trash"></i>
                            </a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(items)}">
                        <td colspan="4" class="text-center">Список ролей пуст</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
