<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Создание нового места</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .container {
            max-width: 800px;
        }
        .form-header {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 5px 5px 0 0;
            border-bottom: 1px solid #dee2e6;
        }
        .form-content {
            padding: 20px;
        }
        .form-footer {
            background-color: #f8f9fa;
            padding: 15px 20px;
            border-top: 1px solid #dee2e6;
            border-radius: 0 0 5px 5px;
        }
    </style>
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="form-header">
            <h2 class="mb-0">Создание нового места</h2>
            <p class="text-muted mt-2 mb-0">Заполните форму для создания нового места</p>
        </div>

        <div class="form-content">
            <form th:action="@{/place/save}" th:object="${form}" method="post">
                <div class="mb-4">
                    <label for="name" class="form-label fw-bold">Название места</label>
                    <input type="text"
                           class="form-control form-control-lg"
                           id="name"
                           th:field="*{name}"
                           placeholder="Введите название места"
                           required>
                    <div class="form-text">Введите уникальное название места</div>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name()}">
                        Ошибка ввода названия места
                    </div>
                </div>

                <div class="mb-4">
                    <label for="address" class="form-label fw-bold">Адрес</label>
                    <input type="text"
                           class="form-control form-control-lg"
                           id="address"
                           th:field="*{address}"
                           placeholder="Введите адрес места"
                           required>
                    <div class="form-text">Укажите полный адрес места</div>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('address')}" th:errors="*{address}">
                        Ошибка ввода адреса
                    </div>
                </div>

                <div class="mb-4">
                    <label for="code" class="form-label fw-bold">Код</label>
                    <input type="text"
                           class="form-control form-control-lg"
                           id="code"
                           th:field="*{code}"
                           placeholder="Введите код места"
                           required>
                    <div class="form-text">Укажите полный код места</div>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('code')}" th:errors="*{code}">
                        Ошибка ввода кода
                    </div>
                </div>

                <div class="form-footer d-flex justify-content-between">
                    <a th:href="@{/place/place-list}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i> Назад к списку
                    </a>
                    <button type="submit" class="btn btn-primary">
                        Сохранить место
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="text-center mt-4">
        <a th:href="@{/place/place-list}" class="text-decoration-none">
            &larr; Вернуться к списку мест
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
