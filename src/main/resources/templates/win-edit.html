<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование окна</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .container {
            max-width: 800px;
        }
        .form-header {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 5px 5px 0 0;
            border-bottom: 1px solid #dee2e6;
        }
        .form-content {
            padding: 20px;
        }
        .form-footer {
            background-color: #f8f9fa;
            padding: 15px 20px;
            border-top: 1px solid #dee2e6;
            border-radius: 0 0 5px 5px;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow-sm">
            <div class="form-header">
                <h2 class="mb-0">Редактирование окна</h2>
                <p class="text-muted mt-2 mb-0">Измените данные окна</p>
            </div>

            <div class="form-content">
                <form th:action="@{/win/update/{id}(id=${form.id})}" th:object="${form}" method="post">
                    <input type="hidden" name="id" th:value="${form.id}">

                    <div class="mb-4">
                        <label for="number" class="form-label fw-bold">Номер окна</label>
                        <input type="text"
                               class="form-control form-control-lg"
                               id="number"
                               th:field="*{number}"
                               placeholder="Введите номер окна"
                               required>
                        <div class="form-text">Введите уникальный номер окна</div>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('number')}" th:errors="*{number}">
                            Ошибка ввода номера окна
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="place" class="form-label fw-bold">Место</label>
                        <select class="form-select form-select-lg"
                                id="place"
                                th:field="*{placeId}"
                                required>
                            <option value="">Выберите место</option>
                            <option th:each="place : ${places}"
                                    th:value="${place.id}"
                                    th:text="${place.name}">
                            </option>
                        </select>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('placeId')}" th:errors="*{placeId}">
                            Ошибка выбора места
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="operatorId" class="form-label fw-bold">Пользователь</label>
                        <select class="form-select form-select-lg"
                                id="operatorId"
                                th:field="*{operatorId}"
                                required>
                            <option value="">Выберите пользователя</option>
                            <option th:each="user : ${users}"
                                    th:value="${user.id}"
                                    th:text="${user.name}">
                            </option>
                        </select>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('operatorId')}" th:errors="*{operatorId}">
                            Ошибка выбора пользователя
                        </div>
                    </div>

                    <div class="form-footer d-flex justify-content-between">
                        <a th:href="@{/win/win-list}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left"></i> Назад к списку
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i> Сохранить изменения
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="text-center mt-4">
            <a th:href="@{/win/win-list}" class="text-decoration-none">
                &larr; Вернуться к списку окон
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
