<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Создание места таможенного оформления</title>
</head>
<body>
<h1>Создать место таможенного оформления</h1>
<form th:action="@{/place/save}" th:object="${form}" method="post">
    <div>
        <label>Название места: <input type="text" th:field="*{name}" required/></label>
    </div>
    <div>
        <label>Адрес: <input type="text" th:field="*{address}" required/></label>
    </div>
    <div>
        <label>Код: <input type="text" th:field="*{code}" required/></label>
    </div>
    <button type="submit">Сохранить</button>
</form>
<a href="/place/list">Назад к списку</a>
</body>
</html>
