<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование страницы</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .container {
            max-width: 800px;
        }
        .form-header {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 5px 5px 0 0;
            border-bottom: 1px solid #dee2e6;
        }
        .form-content {
            padding: 20px;
        }
        .form-footer {
            background-color: #f8f9fa;
            padding: 15px 20px;
            border-top: 1px solid #dee2e6;
            border-radius: 0 0 5px 5px;
        }
    </style>
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="form-header">
            <h2 class="mb-0">Редактирование страницы</h2>
            <p class="text-muted mt-2 mb-0">Измените данные страницы</p>
        </div>

        <div class="form-content">
            <form th:action="@{/page/update/{id}(id=${form.id})}" th:object="${form}" method="post">
                <input type="hidden" name="id" th:value="${form.id}">

                <div class="mb-4">
                    <label for="name" class="form-label fw-bold">Название страницы</label>
                    <input type="text"
                           class="form-control form-control-lg"
                           id="name"
                           th:field="*{name}"
                           placeholder="Введите название страницы"
                           required>
                    <div class="form-text">Введите уникальное название страницы</div>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">
                        Ошибка ввода названия страницы
                    </div>
                </div>



                <div class="form-footer d-flex justify-content-between">
                    <a th:href="@{/page/page-list}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i> Назад к списку
                    </a>
                    <button type="submit" class="btn btn-primary">
                        Сохранить изменения
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="text-center mt-4">
        <a th:href="@{/page/page-list}" class="text-decoration-none">
            &larr; Вернуться к списку страниц
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
