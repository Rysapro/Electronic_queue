<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Редактирование пользователя</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .container { max-width: 800px; }
        .form-header {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 5px 5px 0 0;
            border-bottom: 1px solid #dee2e6;
        }
        .form-content { padding: 20px; }
        .form-footer {
            background-color: #f8f9fa;
            padding: 15px 20px;
            border-top: 1px solid #dee2e6;
            border-radius: 0 0 5px 5px;
        }
    </style>
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="form-header">
            <h2 class="mb-0">Редактирование пользователя</h2>
            <p class="text-muted mt-2 mb-0">Измените данные пользователя</p>
        </div>

        <div class="form-content">
            <form th:action="@{/user/update/{id}(id=${form.id})}" th:object="${form}" method="post">
                <input type="hidden" name="id" th:field="*{form.id}">

                <div class="mb-4">
                    <label for="name" class="form-label fw-bold">Имя</label>
                    <input type="text"
                           class="form-control form-control-lg"
                           id="name"
                           th:field="*{name}"
                           placeholder="Введите имя"
                           required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">
                        Ошибка ввода имени
                    </div>
                </div>

                <div class="mb-4">
                    <label for="surname" class="form-label fw-bold">Фамилия</label>
                    <input type="text"
                           class="form-control form-control-lg"
                           id="surname"
                           th:field="*{surname}"
                           placeholder="Введите фамилию"
                           required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('surname')}" th:errors="*{surname}">
                        Ошибка ввода фамилии
                    </div>
                </div>

                <div class="mb-4">
                    <label for="patronymic" class="form-label fw-bold">Отчество</label>
                    <input type="text"
                           class="form-control form-control-lg"
                           id="patronymic"
                           th:field="*{patronymic}"
                           placeholder="Введите отчество">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('patronymic')}" th:errors="*{patronymic}">
                        Ошибка ввода отчества
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label fw-bold">Новый пароль</label>
                    <input type="password"
                           class="form-control form-control-lg"
                           id="password"
                           th:field="*{password}"
                           placeholder="Введите новый пароль">
                    <div class="form-text">Оставьте пустым, чтобы сохранить текущий пароль</div>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">
                        Ошибка ввода пароля
                    </div>
                </div>

                <div class="mb-4">
                    <label for="blocked" class="form-label fw-bold">Статус</label>
                    <select class="form-select form-select-lg"
                            id="blocked"
                            th:field="*{blocked}">
                        <option th:value="false">Активен</option>
                        <option th:value="true">Заблокирован</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label for="role" class="form-label fw-bold">Роль</label>
                    <select class="form-select form-select-lg"
                            id="roleId"
                            th:field="*{roleId}"
                            required>
                        <option value="">Выберите роль</option>
                        <option th:each="role : ${roles}"
                                th:value="${role.id}"
                                th:text="${role.name}">
                        </option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('roleId')}" th:errors="*{roleId}">
                        Ошибка выбора роли
                    </div>
                </div>

                <div class="mb-4">
                    <label for="placeId" class="form-label fw-bold">Место работы</label>
                    <select class="form-select form-select-lg"
                            id="placeId"
                            th:field="*{placeId}"
                            required>
                        <option value="">Выберите место работы</option>
                        <option th:each="place : ${places}"
                                th:value="${place.id}"
                                th:text="${place.placeName}">
                        </option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('placeId')}" th:errors="*{placeId}">
                        Ошибка выбора места работы
                    </div>
                </div>

                <div class="form-footer d-flex justify-content-between">
                    <a th:href="@{/user/user-list}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i> Назад к списку
                    </a>
                    <button type="submit" class="btn btn-primary">
                        Сохранить изменения
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="text-center mt-4">
        <a th:href="@{/user/user-list}" class="text-decoration-none">
            &larr; Вернуться к списку пользователей
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
