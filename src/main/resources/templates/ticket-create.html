<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Создание талона</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .container { max-width: 800px; }
        .form-select-lg, .form-control-lg { font-size: 1rem; }
    </style>
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-header bg-white py-3">
            <h2 class="mb-0">Создание талона</h2>
        </div>

        <div class="card-body">
            <form th:action="@{/ticket/save}" th:object="${form}" method="post">
                <div class="mb-4">
                    <label for="placeId" class="form-label fw-bold">Место</label>
                    <select class="form-select form-select-lg"
                            id="placeId"
                            th:field="*{placeId}"
                            required>
                        <option value="">Выберите место</option>
                        <option th:each="place : ${places}"
                                th:value="${place.id}"
                                th:text="${place.name}">
                        </option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('placeId')}" th:errors="*{placeId}"></div>
                </div>

                <div class="mb-4">
                    <label for="provisionId" class="form-label fw-bold">Услуга</label>
                    <select class="form-select form-select-lg"
                            id="provisionId"
                            th:field="*{provisionId}"
                            required>
                        <option value="">Выберите услугу</option>
                        <option th:each="provision : ${provisions}"
                                th:value="${provision.id}"
                                th:text="${provision.name}">
                        </option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('provisionId')}" th:errors="*{provisionId}"></div>
                </div>

                <div class="mb-4">
                    <label for="informationId" class="form-label fw-bold">Информация</label>
                    <select class="form-select form-select-lg"
                            id="informationId"
                            th:field="*{informationId}">
                        <option value="">Выберите информацию</option>
                        <option th:each="information : ${informations}"
                                th:value="${information.id}"
                                th:text="${information.declaration}">
                        </option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('informationId')}" th:errors="*{informationId}"></div>
                </div>

                <div class="mb-4">
                    <label for="ticketStatusId" class="form-label fw-bold">Статус талона</label>
                    <select class="form-select form-select-lg"
                            id="ticketStatusId"
                            th:field="*{ticketStatusId}"
                            required>
                        <option value="">Выберите статус</option>
                        <option th:each="status : ${ticketStatuses}"
                                th:value="${status.id}"
                                th:text="${status.name}">
                        </option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('ticketStatusId')}" th:errors="*{ticketStatusId}"></div>
                </div>



                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary btn-lg">Создать талон</button>
                    <a th:href="@{/ticket/ticket-list}" class="btn btn-outline-secondary btn-lg">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
