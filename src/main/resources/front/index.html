<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генерация талона</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="script.js" defer></script>
</head>
<body>
<h2>Генерация талона</h2>

<!-- Форма для ввода ID для обновления -->
<div id="updateSection">
    <label>Введите ID талона для обновления:</label>
    <input type="number" id="ticketId" required>
    <button onclick="fetchTicketData()">Получить данные талона</button>
</div>

<!-- Форма для создания талона -->
<div id="createTicketSection">
    <label>Place ID:</label>
    <input type="number" id="placeId" required>
    <br><br>

    <label>Provision ID:</label>
    <input type="number" id="provisionId" required>
    <br><br>

    <label>Ticket Status ID:</label>
    <input type="number" id="ticketStatusId" required>
    <br><br>

    <button onclick="sendTicket()">Создать талон</button>
</div>

<!-- Форма для обновления данных -->
<div id="updateFields" style="display: none;">
    <h3>Редактирование талона</h3>

    <label>Place ID:</label>
    <input type="number" id="newPlaceId" required>
    <br><br>

    <label>Provision ID:</label>
    <input type="number" id="newProvisionId" required>
    <br><br>

    <label>Ticket Status ID:</label>
    <input type="number" id="newTicketStatusId" required>
    <br><br>

    <button onclick="sendUpdateTicket()">Обновить талон</button>
    <button onclick="cancelUpdate()">Отменить обновление</button>
</div>

<!-- Кнопка для удаления талона -->
<button onclick="deleteTicket()">Удалить талон</button>

<p id="response"></p>
</body>
</html>
