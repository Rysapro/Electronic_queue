<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генерация талона</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="script.js" defer></script>
</head>
<body>
<h2>Генерация талона</h2>

<div id="createTicketSection">
    <label>Place ID:</label>
    <input type="number" id="placeId" required>
    <br><br>

    <label>Provision ID:</label>
    <input type="number" id="provisionId" required>
    <br><br>

    <button onclick="sendTicket()">Создать талон</button>
    <button onclick="updateTicket()">Обновить талон</button>
    <button onclick="deleteTicket()">Удалить талон</button>


</div>

<div id="ticketDetails" style="display: none;">
    <h3>Update Ticket Details</h3>
    <form id="updateForm">
        <div>
            <label for="placeId">Place ID:</label>
            <input type="number" id="updatePlaceId" placeholder="Enter Place ID">
        </div>
        <div>
            <label for="provisionId">Provision ID:</label>
            <input type="number" id="updateProvisionId" placeholder="Enter Provision ID">
        </div>
        <div>
            <label for="ticketStatusId">Ticket Status ID:</label>
            <input type="number" id="ticketStatusId" placeholder="Enter Ticket Status ID">
        </div>
        <button type="button" onclick="updateTicket()">Update Ticket</button>
    </form>
</div>
<p id="response"></p>
</body>
</html>
