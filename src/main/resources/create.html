<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Создание пользователя</title>
</head>
<body>
<h1>Создать пользователя</h1>
<form th:action="@{/user/save}" th:object="${form}" method="post">
    <label>Имя: <input type="text" th:field="*{name}" required/></label><br>
    <label>Фамилия: <input type="text" th:field="*{surname}" required/></label><br>
    <label>Отчество: <input type="text" th:field="*{patronymic}"/></label><br>
    <label>Заблокирован: <input type="checkbox" th:field="*{blocked}"/></label><br>

    <label>Место (ID): <selection type="number" th:field="*{placeId}" required/></label><br>
    <label>Роль (ID): <input type="number" th:field="*{roleId}" required/></label><br>

    <button type="submit">Сохранить</button>
</form>
<a href="/user/list">Назад к списку</a>
</body>
</html>
